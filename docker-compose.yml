services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: escola
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escola}
      POSTGRES_DB: escola
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escola -d escola"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://escola:${POSTGRES_PASSWORD:-escola}@db:5432/escola?schema=public"
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-de-exemplo}
      PORT: "3000"
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@escola.local}
      ADMIN_SENHA: ${ADMIN_SENHA:-admin1234}
      SEED_DEMO: ${SEED_DEMO:-false}
      # Fuso horário da API: vale para a hora da cópia automática e para as datas dos registros
      TZ: ${FUSO_HORARIO:-America/Sao_Paulo}
      ATUALIZADOR_URL: http://atualizador:4000
    volumes:
      - dados_api:/dados
      - dados_backups:/dados/backups
    ports:
      - "127.0.0.1:${API_PORT:-3090}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build: ./client
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8090}:80"
    restart: unless-stopped

  # Atualizador: baixa a versão nova do GitHub e reconstrói a API e o site.
  # Tem acesso ao Docker deste computador (soquete montado). Não publica porta: só a API fala com ele.
  atualizador:
    build: ./atualizador
    environment:
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-de-exemplo}
      PROJETO_COMPOSE: ${COMPOSE_PROJECT_NAME}
    volumes:
      - .:/projeto
      - /var/run/docker.sock:/var/run/docker.sock
      - dados_atualizador:/dados
    restart: unless-stopped

volumes:
  dados_db:
  dados_api:
  dados_backups:
  dados_atualizador:
