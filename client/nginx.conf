server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança (add_header dentro de location anula os daqui; por isso os locations com add_header os repetem)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Corpo de requisição: o sistema envia imagens reduzidas
    client_max_body_size 2m;

    # API: encaminha para o contêiner "api"
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Cópias de segurança: arquivos grandes no envio e operações longas (criar e restaurar)
    location ~ ^/api/backups(/|$) {
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Documentos da matrícula online: envio de até 10 MB por arquivo (corpo bruto, sem guardar em buffer)
    location = /api/matricula-online/documentos {
        client_max_body_size 12m;
        proxy_request_buffering off;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Arquivos das salas de aula: envio de até 20 MB (corpo bruto, sem guardar em buffer)
    location ~ ^/api/arquivos(/|$) {
        client_max_body_size 25m;
        proxy_request_buffering off;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Service worker e manifesto do PWA: sem cache, para atualizar sempre
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # App de página única (React Router)
    location / {
        try_files $uri /index.html;
    }
}
